<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Quellen prüfen · Meine Bücher</title>
  <!--
    Prüfseite: Sind die Metadaten-Quellen aus diesem Browser erreichbar?
    Fragt jede Adresse, die die App benutzt, einmal mit einem bekannten Buch ab.
    "Gesperrt" heißt meist: Die Quelle erlaubt keine Abfragen von fremden Websites (CORS).
    Nicht Teil der App und nicht im Offline-Speicher; braucht Internet.
  -->
  <style>
    :root {
      --bg: #E3DAD3; --surface: #F2EBE6; --line: #C8BBB1; --ink: #111111; --muted: #5C524D;
      --accent: #E8451C; --ok: #2B6B3A; --ok-tint: #DCE8DA; --err: #A3182B; --err-tint: #F2D3D3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1D1916; --surface: #27221E; --line: #3D3530; --ink: #F2EBE6; --muted: #B5AAA2;
        --ok: #8CC79A; --ok-tint: #1F3324; --err: #F2A0A8; --err-tint: #3D1C20;
      }
    }
    body {
      margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-family: Georgia, serif; font-size: 1.6rem; margin: 0 0 8px; border-bottom: 3px solid var(--accent); padding-bottom: 8px; }
    p { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; background: var(--surface); }
    td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
    td small { display: block; color: var(--muted); word-break: break-all; }
    .ok { color: var(--ok); background: var(--ok-tint); font-weight: 600; white-space: nowrap; }
    .err { color: var(--err); background: var(--err-tint); font-weight: 600; white-space: nowrap; }
    a { color: inherit; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
  </style>
</head>
<body>
<main>
  <h1>Quellen prüfen</h1>
  <p>Diese Seite fragt jede Quelle der Metadaten-Suche einmal ab. Rot markierte Quellen funktionieren in
    diesem Browser nicht; schalte sie in der App unter <em>Einstellungen → Metadaten-Suche</em> ab.</p>
  <table><tbody id="rows"></tbody></table>
  <p><a href="./">Zurück zur App</a></p>
</main>
<script>
  // Ein bekanntes Buch (Jenny Erpenbeck, Kairos), damit jede Quelle etwas findet
  const ISBN = '9783630877396';
  const CHECKS = [
    ['DNB (Katalog)', `https://services.dnb.de/sru/dnb?version=1.1&operation=searchRetrieve&query=${encodeURIComponent('isbn=' + ISBN)}&recordSchema=MARC21-xml&maximumRecords=1`, 'text'],
    ['Google Books', `https://www.googleapis.com/books/v1/volumes?q=isbn:${ISBN}&maxResults=1`, 'text'],
    ['Open Library (Ausgabe)', `https://openlibrary.org/isbn/${ISBN}.json`, 'text'],
    ['Open Library (Suche)', 'https://openlibrary.org/search.json?q=erpenbeck+kairos&fields=key,title&limit=1', 'text'],
    ['Open Library (Cover)', `https://covers.openlibrary.org/b/isbn/${ISBN}-M.jpg`, 'blob'],
  ];

  async function check(url, kind) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (res.status === 429) return [true, 'erreichbar, aber gerade zu viele Anfragen'];
      if (!res.ok && res.status !== 404) return [false, `Fehler ${res.status}`];
      const body = kind === 'blob' ? await res.blob() : await res.text();
      return [true, kind === 'blob' ? `Bild ${body.type || '?'}, ${body.size} Bytes` : `Antwort ${body.length} Zeichen`];
    } catch (err) {
      if (err.name === 'AbortError') return [false, 'keine Antwort (Zeitüberschreitung)'];
      return [false, navigator.onLine === false ? 'offline' : 'gesperrt (CORS) oder nicht erreichbar'];
    } finally {
      clearTimeout(timer);
    }
  }

  const rows = document.getElementById('rows');
  for (const [label, url, kind] of CHECKS) {
    const tr = document.createElement('tr');
    const name = document.createElement('td');
    name.textContent = label;
    const small = document.createElement('small');
    small.textContent = new URL(url).host;
    name.appendChild(small);
    const result = document.createElement('td');
    result.textContent = 'prüfe …';
    tr.append(name, result);
    rows.appendChild(tr);
    check(url, kind).then(([ok, detail]) => {
      result.className = ok ? 'ok' : 'err';
      result.textContent = ok ? 'funktioniert' : 'gesperrt';
      const d = document.createElement('small');
      d.textContent = detail;
      result.appendChild(d);
    });
  }
</script>
</body>
</html>
